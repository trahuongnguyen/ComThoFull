# Development Configuration
spring.application.name=BE_Restaurant

# Server
server.port=8080
server.address=127.0.0.1

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/restaurant?createDatabaseIfNotExist=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=utf-8
spring.datasource.username=root
spring.datasource.password=12345678

# JWT
jwt.expiration=604800000
jwt.secret=local-dev-jwt-secret-change-in-production

# Error handling
server.error.whitelabel.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.example.be_restaurant=DEBUG

